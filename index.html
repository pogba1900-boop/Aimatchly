<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AIMatchly — Find the right AI for what you want to do</title>

  <meta name="description" content="Tell AIMatchly what you want to accomplish and discover the AI tools that fit your needs.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #171923;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #635bff;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #555;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 75px 20px 55px;
      background: white;
    }

    .hero h1 {
      font-size: 42px;
      max-width: 750px;
      margin: auto;
      line-height: 1.15;
    }

    .hero p {
      margin: 20px auto 30px;
      max-width: 600px;
      color: #666;
      font-size: 18px;
      line-height: 1.6;
    }

    .search-box {
      max-width: 700px;
      margin: auto;
      display: flex;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 7px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      padding: 16px;
      font-size: 16px;
    }

    .search-box button {
      background: #635bff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .examples {
      margin-top: 18px;
      color: #777;
      font-size: 14px;
    }

    .section {
      max-width: 1100px;
      margin: auto;
      padding: 55px 20px;
    }

    .section h2 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .step {
      background: white;
      padding: 28px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #eee;
    }

    .number {
      width: 42px;
      height: 42px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #635bff;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .step h3 {
      margin-bottom: 10px;
    }

    .step p {
      color: #666;
      line-height: 1.5;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .category {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #eee;
      text-align: center;
      cursor: pointer;
    }

    .category:hover {
      border-color: #635bff;
    }

    #results {
      display: none;
      max-width: 900px;
      margin: 0 auto 50px;
      padding: 0 20px;
    }

    .result-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .tool {
      background: white;
      border: 1px solid #eee;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .tool h3 {
      margin-bottom: 8px;
    }

    .match {
      display: inline-block;
      background: #e9e7ff;
      color: #5148d8;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .tool p {
      color: #666;
      margin: 7px 0;
      line-height: 1.5;
    }

    .tool a {
      display: inline-block;
      margin-top: 10px;
      color: #635bff;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      background: #171923;
      color: white;
      text-align: center;
      padding: 35px 20px;
      margin-top: 40px;
    }

    @media(max-width: 700px) {

      header {
        padding: 15px 20px;
      }

      nav {
        display: none;
      }

      .hero {
        padding: 55px 18px 40px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 16px;
      }

      .search-box {
        flex-direction: column;
        border: none;
        box-shadow: none;
        background: transparent;
      }

      .search-box input {
        background: white;
        border: 1px solid #ddd;
        border-radius: 10px;
        margin-bottom: 10px;
      }

      .search-box button {
        height: 52px;
      }

      .steps {
        grid-template-columns: 1fr;
      }

      .categories {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">AI<span>Matchly</span></div>

  <nav>
    <a href="#">AI Tools</a>
    <a href="#">Categories</a>
    <a href="#">Guides</a>
    <a href="#">About</a>
  </nav>
</header>


<section class="hero">

  <h1>Find the right AI for what you want to do.</h1>

  <p>
    Tell us what you want to accomplish.
    We'll find the AI tools that fit your needs.
  </p>

  <div class="search-box">

    <input
      id="userInput"
      type="text"
      placeholder="What do you want AI to help you with?"
    >

    <button onclick="findAI()">
      FIND MY AI →
    </button>

  </div>
