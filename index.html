<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AIMatchly — Find the right AI</title>

<meta name="description" content="AIMatchly helps you find the right AI tool for your specific goal, budget and experience.">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fc;
  color:#171923;
  line-height:1.5;
}

header{
  background:white;
  border-bottom:1px solid #e8e8ee;
  padding:17px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}

.logo span{
  color:#635bff;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  text-decoration:none;
  color:#555;
  font-size:14px;
}

.hero{
  background:white;
  text-align:center;
  padding:75px 20px 65px;
}

.badge{
  display:inline-block;
  background:#eeecff;
  color:#554bd8;
  padding:7px 13px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:18px;
}

.hero h1{
  max-width:800px;
  margin:auto;
  font-size:48px;
  line-height:1.1;
  letter-spacing:-1.5px;
}

.hero h1 span{
  color:#635bff;
}

.hero p{
  max-width:650px;
  margin:20px auto 30px;
  color:#666;
  font-size:18px;
}

.search-container{
  max-width:760px;
  margin:auto;
}

.search-box{
  background:white;
  border:1px solid #ddd;
  border-radius:16px;
  padding:7px;
  display:flex;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.search-box input{
  flex:1;
  border:0;
  outline:0;
  padding:17px;
  font-size:16px;
  min-width:0;
}

.search-box button{
  border:0;
  background:#635bff;
  color:white;
  border-radius:11px;
  padding:0 25px;
  font-weight:bold;
  cursor:pointer;
}

.search-box button:hover{
  opacity:.9;
}

.examples{
  margin-top:15px;
  color:#888;
  font-size:13px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:55px 20px;
}

.section-title{
  text-align:center;
  margin-bottom:30px;
}

.section-title h2{
  font-size:30px;
  margin-bottom:8px;
}

.section-title p{
  color:#777;
}

.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.step{
  background:white;
  border:1px solid #eee;
  border-radius:16px;
  padding:28px;
  text-align:center;
}

.step-number{
  width:45px;
  height:45px;
  background:#635bff;
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 15px;
  font-weight:bold;
}

.step h3{
  margin-bottom:8px;
}

.step p{
  color:#777;
  font-size:14px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.category{
  background:white;
  border:1px solid #eee;
  border-radius:13px;
  padding:20px 12px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

.category:hover{
  border-color:#635bff;
  color:#635bff;
}

#results{
  display:none;
  max-width:900px;
  margin:auto;
  padding:10px 20px 50px;
}

.results-header{
  text-align:center;
  margin-bottom:25px;
}

.results-header h2{
  font-size:30px;
}

.results-header p{
  color:#777;
  margin-top:7px;
}

.tool-card{
  background:white;
  border:1px solid #e7e7ed;
  border-radius:17px;
  padding:23px;
  margin-bottom:15px;
}

.tool-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.tool-name{
  font-size:21px;
  font-weight:bold;
}

.match{
  background:#e9e7ff;
  color:#5148d8;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
}

.tool-card p{
  color:#666;
  margin:10px 0;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:12px 0;
}

.tag
